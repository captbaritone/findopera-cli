# ---------------------------------------------------------------------------
# The same records, rendered by the server.
#
# `asPlainText` is one field that returns the whole record written out, so the
# layout lives in the schema and every client gets the same answer. This is
# what `findopera get` prints; the curated operations above are what `--json`
# returns, and the two are separate documents on purpose -- selecting both
# would fetch the record twice to use half of it.
# ---------------------------------------------------------------------------

query GetRecordingText($id: String!) {
  getRecordingById(id: $id) { asPlainText }
}
query GetOperaText($id: String!) {
  getOperaById(id: $id) { asPlainText }
}
