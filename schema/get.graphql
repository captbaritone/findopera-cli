query GetUpc($id: String!) {
  getUpcById(id: $id) {
    id
    upc
    collection
    recordings { id year opera { id title } }
    spotifyAlbums { id albumName url }
    appleMusicAlbums { id url }
    tidalAlbums { id url }
    naxosAlbums { catalogueId url }
    prestoMusicAlbums { prestoCode url isStreaming }
    musicBrainzReleases { id }
  }
}

