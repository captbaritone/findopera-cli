# What `findopera get <type> <id> --json` fetches, one operation per type.
#
# These are the structured half. The default prints the server's own
# rendering, which is the `*Text` operations at the foot of this file; this is
# what `--json` returns, for a caller computing rather than reading.
#
# Curated rather than derived: the schema is cyclic, so "everything" has no
# meaning, and what is worth seeing differs per type. A recording wants its
# cast; a streaming album wants a URL and the UPC it hangs off.
#
# Validated against the schema by codegen, so a field renamed upstream fails
# the build. The operation names are the contract with src/model/crud.rs, and
# a test checks the two still agree.
#
# Relations are selected with enough to identify them and to look them up
# again — an id and a name — never followed further, so no query here can
# grow without someone deciding it should.

query GetRecording($id: String!) {
  getRecordingById(id: $id) {
    id
    year
    month
    day
    orchestra
    chorus
    url
    historyUrl
    opera { id title englishTitle composer { id fullName } language { name } }
    conductor { id fullName born died }
    portrayals { id noted character { id name } singer { id fullName } }
    upcs { upc }
    relatedUrls { id url }
    coverArt { imageUrl source }
  }
}

query GetOpera($id: String!) {
  getOperaById(id: $id) {
    id
    title
    englishTitle
    librettist
    operaclassId
    wikipediaUrl
    url
    historyUrl
    composer { id fullName born died }
    language { id name abbreviation }
    characters { id name englishName }
  }
}

query GetSinger($id: String!) {
  getSingerById(id: $id) {
