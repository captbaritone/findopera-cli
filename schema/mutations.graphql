# Every mutation this binary sends, bar the two that stand alone:
# `NewToken` in token.graphql and `Say` in feedback.graphql, which
# belong to a command rather than to a record.
#
# Generated by `codegen/mutations.mjs` from the schema and the type
# table. Do not edit; run `npm run generate`.
#
# Checked in and validated for the same reason `get.graphql` is: these
# are strings the binary sends, and a field that changed shape upstream
# should fail the build rather than somebody's edit.

