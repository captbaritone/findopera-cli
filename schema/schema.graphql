  upc: String @semanticNonNull
}

"""
An account: a name, and nothing else.

Not a person, and not verified: anyone can have one, and nobody is asked to
prove anything to get it. What an account is for is narrower than it looks:
it makes the edits of one caller recognizable as one caller's work, so that a
run of changes can be read, trusted or doubted together.

Usually somebody else's. This is what an edit hands back when asked who made
it, so the account being described is far more often the one you are reading
about than the one you are signed in as. `viewer` is the exception.
"""
type User {
  """
  The lists this account keeps, oldest first.
  
  Empty unless the account asking is the account asked about, which today is
  the only way to get here at all, since `viewer` is the sole route to a `User`
  whose collections anybody can see. The check is written anyway, because the
  day a second route appears is not the day anybody will remember this.
  """
  collections: [Collection!] @semanticNonNull
  """
  The change log, narrowed to what this account wrote.
  
  The same entries as `Query.recordChanges`, in the same order, without any
  other account's. A cursor from here resumes here: passing one to
  `Query.recordChanges` silently steps over everything written in between.
  """
  recordChanges(
    """Resume from the `cursor` of the last entry this field returned."""
    after: String
    """At most this many. Capped at 500."""
    first: Int! = 100
    """
    `ASC`, the default, reads from this account's oldest change. `DESC`
    starts at its newest, which is usually the question being asked here.
    """
    order: SortOrder
    """Only rows of this table, read with its own cursor."""
    table: RecordTable
  ): EditedRecordConnection @semanticNonNull
  """
  What to call this account.
  
  Public, and shown on every edit the account has made. Letters, digits and
  hyphens, at most 39, with no hyphen at either end and none doubled. Two
  accounts cannot differ by case alone.
  """
  username: String @semanticNonNull
}

type WikipediaImage {
  """
  This Wikipedia image written out.
  
  For reading, not parsing: one field instead of a query, and the layout may
  change without notice.
  """
  asPlainText: String @semanticNonNull
  history: [Edit!] @semanticNonNull
  """
  The value that identifies this record.
  
  Keyed by the Wikipedia page it came from.
  
  Every type answers to `id`, so that code walking all of them, such as a
  generic get or edit command, needs no table of exceptions. This is another
  name for the same value.
  """
  id: String @semanticNonNull
  imageUrl: String
  wikipediaUrl: String @semanticNonNull
}

"""
A row of `wikipedia_images`, the table behind `WikipediaImage`, as one version of it was written.
"""
type WikipediaImageRow {
  imageUrl: String
  wikipediaUrl: String @semanticNonNull
}
