  A barcode: UPC-A, EAN-13 or GTIN-14.
  
  These are three lengths of one number rather than three different barcodes,
  and the check digit is the same at every length. Any of them is accepted.
  It is stored and returned at the longest, zero-padded to fourteen digits,
  because that is the one form that can hold any of them.
  
  Somewhere less formal than an API (a page, a link, anything a person reads)
  is welcome to drop the leading zeros again.
  """
