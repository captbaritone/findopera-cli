  """
  The barcode, always at its full fourteen digits.
  
  UPC-A, EAN-13 and GTIN-14 are three lengths of one number rather than three
  different barcodes, and the check digit is the same at every length. This
  returns the longest, zero-padded, because it is the one form that can hold
  any of them.
  
