Edit model captures metadata about the edit, such as when it was made, who
made it, and the justification for the edit.
"""
type Edit {
  """
  The account that made this edit.
  
  Null when no account made it: an import from before accounts existed, or a
  migration. The justification usually names the source in that case.
  """
  editor: User
  id: Int @semanticNonNull
  """
  The reason for the edit, given by the editor at the time of the edit.
  
  Generally this should include a link to the source of the information that
  was added/changed, or an explanation of why information was removed.
  """
  justification: String
  """
  How many records this edit touched, including any `records` did not
  return.
  
  Most edits touch one. The imports that seeded this database are edits too,
  and the largest wrote over sixty thousand rows, so this is what tells a
  caller that an edit is a bulk import rather than a change to be read.
  """
  recordCount: Int @semanticNonNull
  """
  What this edit touched: every record it wrote a new version of.
  
  Ordered so that an edit reads the way it happened: by table, then by
  record. Bounded by `first`; `recordCount` is how a caller knows there is
  more.
  """
  records(
    """At most this many records."""
    first: Int! = 100
  ): [EditedRecord!] @semanticNonNull
  """Date/time at which the edit was made"""
  timestamp: DateTime @semanticNonNull
  """A stable address for this edit."""
  url: String @semanticNonNull
}

"""
One record an edit touched.

Records here are immutable: an edit does not change a row, it writes a new
version of one. So this names the record and the version this edit produced,
`changes` says what that version did, and `record` reaches the record itself
as it stands today.
"""
type EditedRecord {
  """
  What this edit did to this record, field by field.
  
  The one thing a reviewer cannot get anywhere else. `record` below returns
  the record as it stands today, which says which opera was changed but not
  what the change said, and the old values live only in the versioned
  tables. So this reads the version this edit wrote and the version before
  it, and returns the fields that differ, and nothing about the fields the
  edit left alone.
  
  On a record this edit created, every field it set, with `before` null.
  
  A deletion writes a new version with the columns unchanged and a flag set,
  so it is reported as a change to `isDeleted`. Otherwise removing a record
  would read as having changed nothing. `isDeleted` is not a field anything
  can write; deleting is its own mutation, and there is no undoing one.
  
  Empty for a table added since this was generated, and for the odd row
  whose previous version is missing: the historical imports wrote versioned
  rows directly, and a few did not start at 1.
  """
  changes: [FieldChange!] @semanticNonNull
  """
  How this record was removed, or null while it is still live.
  
  Describes the state this version left rather than what this edit did, so
  that an entry can be applied on its own: it is set on every version of an
  already-removed record, not only on the one that removed it. `changes`
  carries the transition.
  """
  deletion: RecordDeletion
  """The edit that wrote this version: who made it, when, and why."""
  edit: Edit @semanticNonNull
  """
  True if this version is a comment: it changed no field, and its
  justification is the content.
  """
  isComment: Boolean @semanticNonNull
  """True if this edit created the record rather than changing one."""
  isNew: Boolean @semanticNonNull
  """
  The model this record belongs to, e.g. `Recording`.
  
  Null for a raw join table, which has no model of its own: linking a
  recording to a barcode is an edit like any other, but there is no type to
  name.
  """
  modelName: String
  """
  The record itself, **as it stands now**, not as this edit left it.
  
  Following an edit here tells you which singer was changed, not what the
  change said. The models read the latest version of a row, and their
  relationships resolve against today's data, so there is no honest way to
  hand back the record as of an old version without version-aware traversal
  through every relationship. `changes` is what the change said.
  
  Deleted and merged-away records are returned too, through a lookup that
  reads past the view. Reviewing a merge means seeing the record it took
  away, and the edit that removed a record is exactly the edit somebody needs
  to look at; returning null there left the one case that most needed an
  answer without one.
  
  Null when the record has no model of its own, as with a join table.
  """
  record: EditableRecord @deprecated(reason: "Read `row`, which is this version as it was written. This is the record as it is now, so it disagrees with the rest of the entry, and its relationships fail for a removed record that points at another.")
  """
  Identifies the record within its table. A join table has no single key, so
  its parts are joined with a colon.
  """
  recordId: String @semanticNonNull
  """
  This record as this version wrote it: the columns of its table, with each
  reference as the id it holds.
  
  Describes the same moment as `deletion`, so an entry says one thing.
  Applying entries in order therefore ends at the catalog as it stands: the
  last version of each record is the one that wins. A deletion's row still
  holds every column, as the delete left them.
  
  Present for the join tables too, which have no other type. Null only for
  a table added since codegen last ran.
  """
  row: RecordRow
  """
  The table the record lives in, e.g. `recordings`. Always present, even
  when there is no model.
  """
  tableName: String @semanticNonNull
  """
  Which version of the record this edit produced. Version 1 is the record's
  creation.
  """
  version: Int @semanticNonNull
}

type EditedRecordConnection {
  """The entries on this page, each with its position."""
  edges: [EditedRecordEdge!] @semanticNonNull
  """Whether there is more, and the positions at either end."""
  pageInfo: PageInfo @semanticNonNull
}

type EditedRecordEdge {
  """
  Where this entry sits in the list that returned it. Opaque. Pass it back
  as `after` to resume from just past it.
  """
  cursor: String @semanticNonNull
  node: EditedRecord @semanticNonNull
}

"""
One field an edit changed, and what it changed it from.

Values are rendered as text. The columns behind them are a mix of numbers,
strings and flags, and a reviewer is reading them rather than computing with
them. So `year` arrives as `"1953"` and `noted` as `"true"`, which is what
they would have to type to write the value back. Null is kept as null, so
that a column that held nothing is distinguishable from one that held the
word "null" or an empty string.

A foreign key is the exception that needs more than rendering: `"13282"` is
true and useless. `beforeRecord` and `afterRecord` hand back the record it
points at, for the caller to name however it names things.
"""
type FieldChange {
  """What this edit made it. Null means the edit cleared the field."""
  after: String
  """The record `after` points at. Null on the same terms."""
  afterRecord: EditableRecord
  """
  What the field held before this edit. Null means the column held NULL, and
  on a record this edit created, means there was nothing there at all.
  """
  before: String
  """
  The record `before` points at, when this field is a foreign key, for the
  caller to name the way the rest of its page names things.
  
  Null when the field is not a foreign key, when `before` is null, or when
  the record no longer exists.
  """
  beforeRecord: EditableRecord
  """
  The field's name in the API (`languageId`, not `language_id`), because
  somebody reading a diff is usually on their way to writing the correction.
  
  A join table has no model and so no public names; its columns are named as
  SQLite has them.
  """
  field: String @semanticNonNull
}

