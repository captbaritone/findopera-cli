[package]
name = "findopera"
version = "0.1.0"
edition = "2021"
description = "Renders FindOpera recording metadata through a path-safe template language"

[lib]
name = "findopera"
path = "src/lib.rs"

[[bin]]
name = "findopera"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
walkdir = "2"
ureq = { version = "3", features = ["json"] }

[profile.release]
strip = true
