[package]
name = "findopera"
version = "0.7.0"
edition = "2021"
description = "Organize a library of opera recordings using metadata from findopera.com"
license = "MIT"
repository = "https://github.com/captbaritone/findopera-cli"
readme = "README.md"
keywords = ["opera", "music", "metadata", "cli", "library"]
categories = ["command-line-utilities"]

[lib]
name = "findopera"
path = "src/lib.rs"

[[bin]]
name = "findopera"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
globset = "0.4"
ignore = "0.4"
ureq = { version = "3", features = ["json"] }

[profile.release]
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
