[package]
name = "findopera"
version = "0.1.0"
edition = "2021"
description = "Renders FindOpera recording metadata through a path-safe template language"

[lib]
name = "findopera"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
