[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
# A shell one-liner for macOS and Linux, and its PowerShell equivalent, so
# installing needs neither a Rust toolchain nor a decision about where to put
# a binary.
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Linux builds are static musl rather than glibc. This is meant to be run
# against a music library, and those live on NAS boxes — Synology ships a
# glibc far older than any CI runner's, so a dynamically linked build would
# fail to start on exactly the machines most likely to want it. The starter
# config already knows to ignore @eaDir, which is to say we already expect to
# be there.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
