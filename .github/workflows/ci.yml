name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      # The suites are offline: the template and config cases need nothing,
      # and the scan and plan cases run against recordings captured from the
      # API and checked in.
      - run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  generated:
    name: model is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: codegen
      # src/model/generated.rs is checked in so that schema drift arrives as a
      # reviewable diff. This proves the checked-in copy is what the schema and
      # query actually produce, against the vendored schema — not the live API,
      # so the build does not depend on findopera.com being up.
      - run: npm run generate
        working-directory: codegen
      - run: git diff --exit-code -- src/model/generated.rs
